name: track
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: 'yes = 키워드 발굴 지금 실행'
        required: false
        default: 'no'
permissions:
  contents: write
concurrency:
  group: track
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: load previous data
        run: |
          git fetch origin data --depth=1 || true
          git show origin/data:yt_data.json > prev.json 2>/dev/null || echo '{}' > prev.json
          git show origin/data:hot.json > prev_hot.json 2>/dev/null || echo '{}' > prev_hot.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: track
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FORCE_DISCOVER: ${{ github.event.inputs.discover }}
        run: node tracker.mjs
      - name: publish data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pub
          cp out/yt_data.json out/hot.json /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name "kpac-tracker"
          git config user.email "kpac-tracker@users.noreply.github.com"
          git add .
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: weekly keepalive
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "00" ]; then
            date -u +%Y-%m-%dT%H:%MZ > last_run.txt
            git config user.name "kpac-tracker"
            git config user.email "kpac-tracker@users.noreply.github.com"
            git add last_run.txt && git commit -qm "keepalive" && git push -q || true
          fi
